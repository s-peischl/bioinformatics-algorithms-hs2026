  <text x="108" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b56a3a">place 7 from 0</text>
  <text x="108" y="244" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#b56a3a">needs d = 1   DEAD</text>
