<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
  <rect width="640" height="260" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#6b7380">One column of a conserved block. Every pair of letters is one observation.</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#1c2430">
    <text x="70" y="78" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b7380">human</text>
    <text x="160" y="78">L</text>
    <text x="70" y="114" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b7380">horse</text>
    <text x="160" y="114">I</text>
    <text x="70" y="150" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b7380">mouse</text>
    <text x="160" y="150">L</text>
    <text x="70" y="186" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b7380">yeast</text>
    <text x="160" y="186">L</text>
  </g>
  <rect x="148" y="52" width="36" height="150" rx="4" fill="none" stroke="#b56a3a" stroke-width="2"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1c2430">
    <text x="280" y="78">Pairs in this column</text>
    <text x="280" y="114">L with L: three</text>
    <text x="280" y="150">L with I: three</text>
    <text x="280" y="186">I with I: none</text>
  </g>
  <text x="280" y="228" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#6b7380">Four sequences, six pairs. Sum this over every column.</text>
</svg>
