<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310">
  <rect width="660" height="310" fill="#ffffff"/>
  <text x="330" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Related sequences share an ancestor. Along a branch: mutation, insertion, or deletion.</text>

  <line x1="200" y1="78" x2="100" y2="155" stroke="#1c2430" stroke-width="2.5"/>
  <line x1="200" y1="78" x2="300" y2="155" stroke="#1c2430" stroke-width="2.5"/>

  <text x="200" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#b56a3a">ancestor</text>
  <rect x="132" y="48" width="136" height="40" rx="8" fill="#f7f3ee" stroke="#b56a3a" stroke-width="2"/>
  <text x="200" y="74" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#1c2430">G C T</text>

  <text x="108" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2a5a8c">no change</text>
  <text x="108" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7380">(or a mutation</text>
  <text x="108" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7380">in a letter)</text>

  <text x="312" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2a5a8c">insertion</text>
  <text x="312" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#b56a3a">+A after C</text>

  <rect x="52" y="168" width="96" height="40" rx="8" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="100" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#1c2430">G C T</text>
  <text x="100" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">sequence 1</text>

  <rect x="252" y="168" width="96" height="40" rx="8" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="300" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#1c2430">G C A T</text>
  <text x="300" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">sequence 2</text>

  <line x1="370" y1="130" x2="420" y2="130" stroke="#c5ccd6" stroke-width="2"/>
  <polygon points="428,130 418,125 418,135" fill="#c5ccd6"/>

  <rect x="438" y="48" width="200" height="210" rx="10" fill="#fafbfc" stroke="#d8dce3" stroke-width="2"/>
  <text x="538" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b56a3a">alignment we want</text>
  <text x="538" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">columns = ancestral sites</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#1c2430">
    <text x="468" y="140">G</text>
    <text x="498" y="140">C</text>
    <text x="528" y="140" fill="#b56a3a">-</text>
    <text x="558" y="140">T</text>
    <text x="468" y="172">G</text>
    <text x="498" y="172">C</text>
    <text x="528" y="172" fill="#2a5a8c">A</text>
    <text x="558" y="172">T</text>
  </g>

  <rect x="460" y="118" width="28" height="64" rx="4" fill="none" stroke="#d8dce3" stroke-width="1.5"/>
  <rect x="490" y="118" width="28" height="64" rx="4" fill="none" stroke="#d8dce3" stroke-width="1.5"/>
  <rect x="520" y="118" width="28" height="64" rx="4" fill="none" stroke="#b56a3a" stroke-width="1.8"/>
  <rect x="550" y="118" width="28" height="64" rx="4" fill="none" stroke="#d8dce3" stroke-width="1.5"/>

  <text x="538" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">gap ↔ insertion / deletion</text>
  <text x="538" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">same column ↔ homology</text>

  <text x="330" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">Each column recovers one ancestral position. That is why we want an alignment.</text>
</svg>
