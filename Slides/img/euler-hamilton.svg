<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 228" width="620" height="228">
  <rect width="620" height="228" fill="#ffffff"/>
  <text x="310" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Cover every vertex vs cover every edge.</text>
  <text x="155" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#6b7380">Hamiltonian</text>
  <defs><marker id="eh" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b56a3a"/></marker></defs>
  <line x1="60" y1="100" x2="140" y2="70" stroke="#b56a3a" stroke-width="2" marker-end="url(#eh)"/>
  <line x1="140" y1="70" x2="220" y2="100" stroke="#b56a3a" stroke-width="2" marker-end="url(#eh)"/>
  <line x1="220" y1="100" x2="140" y2="150" stroke="#b56a3a" stroke-width="2" marker-end="url(#eh)"/>
  <circle cx="60" cy="100" r="14" fill="#2a5a8c"/>
  <text x="60" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f4f5f7">1</text>
  <circle cx="140" cy="70" r="14" fill="#2a5a8c"/>
  <text x="140" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f4f5f7">2</text>
  <circle cx="220" cy="100" r="14" fill="#2a5a8c"/>
  <text x="220" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f4f5f7">3</text>
  <circle cx="140" cy="150" r="14" fill="#2a5a8c"/>
  <text x="140" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f4f5f7">4</text>
  <text x="140" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b56a3a">visit every vertex once</text>
  <text x="140" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">hard (TSP)</text>
  <text x="460" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#6b7380">Eulerian</text>
  <line x1="380" y1="100" x2="500" y2="70" stroke="#b56a3a" stroke-width="3"/>
  <line x1="500" y1="70" x2="540" y2="150" stroke="#b56a3a" stroke-width="3"/>
  <line x1="540" y1="150" x2="400" y2="160" stroke="#b56a3a" stroke-width="3"/>
  <line x1="400" y1="160" x2="380" y2="100" stroke="#b56a3a" stroke-width="3"/>
  <line x1="380" y1="100" x2="540" y2="150" stroke="#b56a3a" stroke-width="3"/>
  <circle cx="380" cy="100" r="10" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <circle cx="500" cy="70" r="10" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <circle cx="540" cy="150" r="10" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <circle cx="400" cy="160" r="10" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="460" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b56a3a">use every edge once</text>
  <text x="460" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">easy (degrees, then trace)</text>

</svg>
