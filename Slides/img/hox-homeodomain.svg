<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1c2430">Two Hox proteins. The shared block is the homeodomain. The ends differ.</text>

  <text x="48" y="88" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">fly Antp</text>
  <rect x="150" y="68" width="150" height="28" rx="6" fill="#e8eaee" stroke="#8b93a0" stroke-width="1.5"/>
  <rect x="300" y="64" width="200" height="36" rx="7" fill="#f7f3ee" stroke="#b56a3a" stroke-width="2.2"/>
  <text x="400" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#b56a3a">homeodomain</text>
  <rect x="500" y="68" width="170" height="28" rx="6" fill="#e8eaee" stroke="#8b93a0" stroke-width="1.5"/>

  <text x="48" y="168" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">mouse HoxA7</text>
  <rect x="170" y="148" width="90" height="28" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="1.5"/>
  <rect x="260" y="144" width="200" height="36" rx="7" fill="#f7f3ee" stroke="#b56a3a" stroke-width="2.2"/>
  <text x="360" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#b56a3a">homeodomain</text>
  <rect x="460" y="148" width="210" height="28" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="1.5"/>

  <text x="360" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1c2430">We want that shared block, not a match of the whole protein.</text>
</svg>
