  <text x="72" y="166" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="normal" fill="#6b7380">s3=0</text>
  <line x1="56.0" y1="156.0" x2="88.0" y2="180.0" stroke="#b56a3a" stroke-width="2.0"/>
