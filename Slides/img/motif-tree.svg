  <text x="240" y="166" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="normal" fill="#6b7380">s3=3</text>
  <line x1="224.0" y1="156.0" x2="256.0" y2="180.0" stroke="#b56a3a" stroke-width="2.0"/>
  <line x1="224.0" y1="180.0" x2="256.0" y2="156.0" stroke="#b56a3a" stroke-width="2.0"/>
  <line x1="560.0" y1="120.0" x2="560.0" y2="148.0" stroke="#1c2430" stroke-width="2" marker-end="url(#ak)"/>
