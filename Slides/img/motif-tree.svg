  <text x="160" y="92" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#b56a3a">s2 start 0  CACG</text>
  <text x="160" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b56a3a">U = 4  >  B</text>
  <rect x="480" y="72" width="160" height="48" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="560" y="92" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#1c2430">s2 start 1  ACGA</text>
  <text x="560" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2a5a8c">U = 1  keep</text>
  <line x1="160.0" y1="120.0" x2="72.0" y2="148.0" stroke="#c5ccd6" stroke-width="1.3"/>
