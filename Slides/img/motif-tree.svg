  <text x="560" y="178" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#1c2430">s3 start 2  ACGT</text>
  <text x="380" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#b56a3a">do not go deeper: every s3 child is already worse than B = 1</text>
  <text x="380" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#6b7380">the sibling with ACGA still has U = 1, so we keep walking there</text>
  <text x="380" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#6b7380">still exact: every crossed-out leaf was already worse than the one we hold</text>
