<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 206" width="420" height="206">
  <rect width="420" height="206" fill="#ffffff"/>
  <text x="210" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Three cities. One tour. Direction is the same cycle.</text>
  <defs><marker id="t3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b56a3a"/></marker></defs>
  <line x1="80" y1="140" x2="340" y2="140" stroke="#b56a3a" stroke-width="2" marker-end="url(#t3)"/>
  <line x1="340" y1="140" x2="210" y2="50" stroke="#b56a3a" stroke-width="2" marker-end="url(#t3)"/>
  <line x1="210" y1="50" x2="80" y2="140" stroke="#b56a3a" stroke-width="2" marker-end="url(#t3)"/>
  <circle cx="80" cy="140" r="16" fill="#1c2430"/>
  <text x="80" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f5f7">A</text>
  <circle cx="340" cy="140" r="16" fill="#1c2430"/>
  <text x="340" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f5f7">B</text>
  <circle cx="210" cy="50" r="16" fill="#1c2430"/>
  <text x="210" y="55" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f5f7">C</text>
  <text x="210" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">(3-1)!/2 = 1. Four cities: three tours. That is the formula.</text>

</svg>
