<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 242" width="560" height="242">
  <rect width="560" height="242" fill="#ffffff"/>
  <text x="280" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Three moves into a cell. Last week had two.</text>
  <defs><marker id="nm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2a5a8c"/></marker></defs>
  <rect x="80" y="50" width="88" height="52" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="124" y="82" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#1c2430">i-1,j-1</text>
  <rect x="240" y="50" width="88" height="52" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="284" y="82" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#1c2430">i-1, j</text>
  <rect x="80" y="150" width="88" height="52" rx="6" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="124" y="182" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#1c2430">i, j-1</text>
  <rect x="240" y="150" width="88" height="52" rx="6" fill="#1c2430" stroke="#2a5a8c" stroke-width="2"/>
  <text x="284" y="182" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#f4f5f7">i, j</text>
  <line x1="168" y1="76" x2="238" y2="76" stroke="#2a5a8c" stroke-width="2" marker-end="url(#nm)"/>
  <line x1="124" y1="104" x2="124" y2="148" stroke="#2a5a8c" stroke-width="2" marker-end="url(#nm)"/>
  <line x1="168" y1="176" x2="238" y2="176" stroke="#2a5a8c" stroke-width="2" marker-end="url(#nm)"/>
  <text x="430" y="70" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b56a3a">diagonal: (mis)match</text>
  <text x="430" y="118" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b56a3a">down: gap in w</text>
  <text x="430" y="176" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b56a3a">right: gap in v</text>
  <text x="280" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">v down the rows, w across. A path is an alignment.</text>

</svg>
