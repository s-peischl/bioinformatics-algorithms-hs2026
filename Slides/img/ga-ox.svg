  <text x="310" y="190" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="#1c2430">E</text>
  <text x="360" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">mutate: swap B and A  ->  ABCDE</text>
  <text x="360" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">Fitness = tour length. Keep short children. No proof of optimality; a method for a good tour.</text>

