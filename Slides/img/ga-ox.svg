  <text x="360" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">copy CDE from P1; fill the rest from P2 in order, skip used</text>
  <text x="56" y="186" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b56a3a">child</text>
  <rect x="80" y="168" width="44" height="32" rx="5" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="102" y="190" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="#1c2430">B</text>
