  <text x="206" y="118" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="#1c2430">E</text>
  <rect x="236" y="96" width="44" height="32" rx="5" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="258" y="118" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="#1c2430">A</text>
