  <text x="310" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="#1c2430">E</text>
  <text x="56" y="114" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1c2430">P2</text>
  <rect x="80" y="96" width="44" height="32" rx="5" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
