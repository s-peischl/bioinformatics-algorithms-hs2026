<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 520 180" width="520" height="180">
  <rect width="520" height="180" fill="#ffffff"/>
  <text x="260" y="24" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">The substring splits after k. Fold each piece on its own.</text>
  <line x1="70" y1="100" x2="450" y2="100" stroke="#1c2430" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="100" r="12" fill="#1c2430"/>
  <text x="70" y="136" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6b7380">i</text>
  <circle cx="160" cy="100" r="12" fill="#1c2430"/>
  <circle cx="250" cy="100" r="16" fill="#ffffff" stroke="#b56a3a" stroke-width="2.4"/>
  <text x="250" y="106" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#b56a3a">k</text>
  <circle cx="340" cy="100" r="12" fill="#1c2430"/>
  <circle cx="450" cy="100" r="12" fill="#1c2430"/>
  <text x="450" y="136" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6b7380">j</text>
  <path d="M 70,86 A 50,32 0 0 1 160,86" fill="none" stroke="#2a5a8c" stroke-width="2.2"/>
  <path d="M 340,86 A 40,28 0 0 1 450,86" fill="none" stroke="#2a5a8c" stroke-width="2.2"/>
  <line x1="250" y1="48" x2="250" y2="148" stroke="#b56a3a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="260" y="164" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1c2430">score N(i, k) + N(k+1, j)</text>
</svg>
