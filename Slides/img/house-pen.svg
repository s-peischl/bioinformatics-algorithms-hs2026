<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 216" width="400" height="216">
  <rect width="400" height="216" fill="#ffffff"/>
  <text x="200" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Draw the house without lifting the pen. Each edge once.</text>
  <line x1="80" y1="80" x2="280" y2="80" stroke="#1c2430" stroke-width="2"/>
  <line x1="280" y1="80" x2="280" y2="160" stroke="#1c2430" stroke-width="2"/>
  <line x1="280" y1="160" x2="80" y2="160" stroke="#1c2430" stroke-width="2"/>
  <line x1="80" y1="160" x2="80" y2="80" stroke="#1c2430" stroke-width="2"/>
  <line x1="80" y1="80" x2="280" y2="160" stroke="#1c2430" stroke-width="2"/>
  <line x1="80" y1="160" x2="280" y2="80" stroke="#1c2430" stroke-width="2"/>
  <line x1="80" y1="80" x2="180" y2="30" stroke="#1c2430" stroke-width="2"/>
  <line x1="180" y1="30" x2="280" y2="80" stroke="#1c2430" stroke-width="2"/>
  <circle cx="80" cy="160" r="12" fill="#b56a3a"/>
  <text x="80" y="164" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f4f5f7">A</text>
  <circle cx="280" cy="160" r="12" fill="#b56a3a"/>
  <text x="280" y="164" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f4f5f7">B</text>
  <circle cx="280" cy="80" r="12" fill="#1c2430"/>
  <text x="280" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f4f5f7">C</text>
  <circle cx="80" cy="80" r="12" fill="#1c2430"/>
  <text x="80" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f4f5f7">D</text>
  <circle cx="180" cy="30" r="12" fill="#1c2430"/>
  <text x="180" y="34" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f4f5f7">E</text>
  <text x="200" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">Warm: odd degree. Two odds => Eulerian path, not a circuit.</text>

</svg>
