<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="720" height="286">
  <rect width="720" height="286" fill="#ffffff"/>
  <text x="360" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Three talks, one room. A and C do not overlap. B is short and sits on the join.</text>
  <line x1="80" y1="200" x2="600" y2="200" stroke="#1c2430" stroke-width="2"/>
  <line x1="80" y1="196" x2="80" y2="204" stroke="#1c2430" stroke-width="2"/>
  <text x="80" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">0</text>
  <line x1="210" y1="196" x2="210" y2="204" stroke="#1c2430" stroke-width="2"/>
  <text x="210" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">2</text>
  <line x1="340" y1="196" x2="340" y2="204" stroke="#1c2430" stroke-width="2"/>
  <text x="340" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">4</text>
  <line x1="470" y1="196" x2="470" y2="204" stroke="#1c2430" stroke-width="2"/>
  <text x="470" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">6</text>
  <line x1="600" y1="196" x2="600" y2="204" stroke="#1c2430" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">8</text>
  <rect x="80" y="48" width="260" height="28" rx="4" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="210.0" y="67" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#1c2430">A  [0,4]</text>
  <text x="348" y="67" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">finish 4</text>
  <rect x="275" y="88" width="130" height="28" rx="4" fill="#f7f3ee" stroke="#b56a3a" stroke-width="2"/>
  <text x="340.0" y="107" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#1c2430">B  [3,5]</text>
  <text x="413" y="107" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">finish 5</text>
  <rect x="340" y="128" width="260" height="28" rx="4" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="470.0" y="147" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#1c2430">C  [4,8]</text>
  <text x="608" y="147" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6b7380">finish 8</text>
  <text x="80" y="248" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2a5a8c">Earliest finish: A then C  (two talks).</text>
  <text x="80" y="268" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b56a3a">Shortest first: B only. The local rule matters.</text>

</svg>
