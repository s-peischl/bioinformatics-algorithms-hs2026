<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250">
  <rect width="480" height="250" fill="#ffffff"/>
  <text x="240" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">Insert 8, 3, 10, 1, 6. Left &lt; node &lt; right.</text>
  <line x1="240" y1="66" x2="140" y2="104" stroke="#1c2430" stroke-width="2"/>
  <line x1="240" y1="66" x2="340" y2="104" stroke="#1c2430" stroke-width="2"/>
  <line x1="140" y1="136" x2="80" y2="174" stroke="#1c2430" stroke-width="2"/>
  <line x1="140" y1="136" x2="200" y2="174" stroke="#1c2430" stroke-width="2"/>
  <circle cx="240" cy="50" r="18" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="240" y="55" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c2430">8</text>
  <circle cx="140" cy="120" r="18" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c2430">3</text>
  <circle cx="340" cy="120" r="18" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="340" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c2430">10</text>
  <circle cx="80" cy="190" r="18" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="80" y="195" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c2430">1</text>
  <circle cx="200" cy="190" r="18" fill="#f7f3ee" stroke="#b56a3a" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c2430">6</text>
  <text x="240" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">Find 6: 8 then 3 then 6. Three comparisons. Balanced: O(log n).</text>

</svg>
