<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#6b7380">One walk on the grid = one alignment of the two strings</text>

  <!-- grid labels -->
  <text x="250" y="58" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">sequence 2: G C A T</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#2a5a8c" text-anchor="middle">
    <text x="130" y="88">-</text>
    <text x="200" y="88">G</text>
    <text x="270" y="88">C</text>
    <text x="340" y="88">A</text>
    <text x="410" y="88">T</text>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#2a5a8c" text-anchor="middle">
    <text x="70" y="128">-</text>
    <text x="70" y="188">G</text>
    <text x="70" y="248">C</text>
    <text x="70" y="308">T</text>
  </g>
  <text x="28" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380" transform="rotate(-90 28 220)">seq 1: GCT</text>

  <!-- empty grid -->
  <g fill="#f4f6f8" stroke="#c5ccd6" stroke-width="2">
    <rect x="95" y="98" width="70" height="60" rx="5"/><rect x="165" y="98" width="70" height="60" rx="5"/><rect x="235" y="98" width="70" height="60" rx="5"/><rect x="305" y="98" width="70" height="60" rx="5"/><rect x="375" y="98" width="70" height="60" rx="5"/>
    <rect x="95" y="158" width="70" height="60" rx="5"/><rect x="165" y="158" width="70" height="60" rx="5"/><rect x="235" y="158" width="70" height="60" rx="5"/><rect x="305" y="158" width="70" height="60" rx="5"/><rect x="375" y="158" width="70" height="60" rx="5"/>
    <rect x="95" y="218" width="70" height="60" rx="5"/><rect x="165" y="218" width="70" height="60" rx="5"/><rect x="235" y="218" width="70" height="60" rx="5"/><rect x="305" y="218" width="70" height="60" rx="5"/><rect x="375" y="218" width="70" height="60" rx="5"/>
    <rect x="95" y="278" width="70" height="60" rx="5"/><rect x="165" y="278" width="70" height="60" rx="5"/><rect x="235" y="278" width="70" height="60" rx="5"/><rect x="305" y="278" width="70" height="60" rx="5"/><rect x="375" y="278" width="70" height="60" rx="5"/>
  </g>

  <!-- path cells -->
  <g fill="#f7f3ee" stroke="#b56a3a" stroke-width="3">
    <rect x="95" y="98" width="70" height="60" rx="5"/>
    <rect x="165" y="158" width="70" height="60" rx="5"/>
    <rect x="235" y="218" width="70" height="60" rx="5"/>
    <rect x="305" y="218" width="70" height="60" rx="5"/>
    <rect x="375" y="278" width="70" height="60" rx="5"/>
  </g>

  <!-- path line -->
  <polyline points="130,128 200,188 270,248 340,248 410,308" fill="none" stroke="#b56a3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#b56a3a">
    <circle cx="130" cy="128" r="7"/>
    <circle cx="200" cy="188" r="7"/>
    <circle cx="270" cy="248" r="7"/>
    <circle cx="340" cy="248" r="7"/>
    <circle cx="410" cy="308" r="7"/>
  </g>

  <!-- step labels on path -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2a5a8c" font-weight="700">
    <text x="155" y="148">1 diag</text>
    <text x="220" y="208">2 diag</text>
    <text x="290" y="238">3 east</text>
    <text x="355" y="288">4 diag</text>
  </g>

  <!-- alignment panel with numbered columns matching steps -->
  <rect x="480" y="100" width="210" height="220" rx="12" fill="#fafbfc" stroke="#d8dce3" stroke-width="2"/>
  <text x="585" y="130" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#b56a3a">alignment from this path</text>

  <!-- column numbers -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7380" text-anchor="middle">
    <text x="525" y="158">1</text>
    <text x="565" y="158">2</text>
    <text x="605" y="158">3</text>
    <text x="645" y="158">4</text>
  </g>

  <g font-family="ui-monospace,Menlo,monospace" font-size="22" text-anchor="middle">
    <text x="525" y="195" fill="#1c2430">G</text>
    <text x="565" y="195" fill="#1c2430">C</text>
    <text x="605" y="195" fill="#b56a3a">-</text>
    <text x="645" y="195" fill="#1c2430">T</text>
    <text x="525" y="235" fill="#1c2430">G</text>
    <text x="565" y="235" fill="#1c2430">C</text>
    <text x="605" y="235" fill="#2a5a8c">A</text>
    <text x="645" y="235" fill="#1c2430">T</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380" text-anchor="middle">
    <text x="525" y="268">match</text>
    <text x="565" y="268">match</text>
    <text x="605" y="268">gap</text>
    <text x="645" y="268">match</text>
  </g>

  <text x="585" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7380">each step adds one column</text>
</svg>
