  <text x="120" y="54" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1c2430">1. Smaller tower to aux</text>
  <line x1="18" y1="176" x2="222" y2="176" stroke="#1c2430" stroke-width="5" stroke-linecap="round"/>
  <rect x="46" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="116" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="186" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="25" y="154" width="50" height="14" rx="3" fill="#1c2430"/>
  <rect x="102" y="154" width="36" height="14" rx="3" fill="#2a5a8c"/>
  <rect x="109" y="138" width="22" height="14" rx="3" fill="#b56a3a"/>
  <text x="50" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">start</text>
  <text x="120" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">aux</text>
  <text x="190" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">goal</text>
  <text x="120" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b56a3a">T(n-1) moves</text>
  <rect x="248" y="36" width="224" height="198" rx="8" fill="#ffffff" stroke="#d8dce3"/>
  <text x="360" y="54" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1c2430">2. Largest disk to goal</text>
  <line x1="258" y1="176" x2="462" y2="176" stroke="#1c2430" stroke-width="5" stroke-linecap="round"/>
  <rect x="286" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="356" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="426" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="342" y="154" width="36" height="14" rx="3" fill="#2a5a8c"/>
  <rect x="349" y="138" width="22" height="14" rx="3" fill="#b56a3a"/>
  <rect x="405" y="154" width="50" height="14" rx="3" fill="#1c2430"/>
  <text x="290" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">start</text>
  <text x="360" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">aux</text>
  <text x="430" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">goal</text>
  <text x="360" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b56a3a">1 move</text>
  <rect x="488" y="36" width="224" height="198" rx="8" fill="#ffffff" stroke="#d8dce3"/>
  <text x="600" y="54" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1c2430">3. Smaller tower to goal</text>
  <line x1="498" y1="176" x2="702" y2="176" stroke="#1c2430" stroke-width="5" stroke-linecap="round"/>
  <rect x="526" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="596" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="666" y="88" width="8" height="88" fill="#8a93a0"/>
  <rect x="645" y="154" width="50" height="14" rx="3" fill="#1c2430"/>
  <rect x="652" y="138" width="36" height="14" rx="3" fill="#2a5a8c"/>
  <rect x="659" y="122" width="22" height="14" rx="3" fill="#b56a3a"/>
  <text x="530" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">start</text>
  <text x="600" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">aux</text>
  <text x="670" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7380">goal</text>
  <text x="600" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b56a3a">T(n-1) moves</text>
  <text x="360" y="256" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b7380">T(n) = T(n-1) + 1 + T(n-1). One disk: T(1) = 1. Then 1, 3, 7, 15, ... = 2^n - 1.</text>

</svg>
