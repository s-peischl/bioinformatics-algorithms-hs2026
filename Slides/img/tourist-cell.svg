<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" width="520" height="262">
  <rect width="520" height="262" fill="#ffffff"/>
  <text x="260" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6b7380">One intersection, two streets in. Take the better.</text>
  <defs><marker id="tc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2a5a8c"/></marker></defs>
  <circle cx="260" cy="70" r="22" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="260" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1c2430">N</text>
  <text x="300" y="74" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">already filled</text>
  <circle cx="90" cy="180" r="22" fill="#eef3f8" stroke="#2a5a8c" stroke-width="2"/>
  <text x="90" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1c2430">W</text>
  <text x="90" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7380">already filled</text>
  <circle cx="260" cy="180" r="26" fill="#1c2430"/>
  <text x="260" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f4f5f7">S</text>
  <line x1="260" y1="94" x2="260" y2="152" stroke="#2a5a8c" stroke-width="2" marker-end="url(#tc)"/>
  <line x1="114" y1="180" x2="232" y2="180" stroke="#2a5a8c" stroke-width="2" marker-end="url(#tc)"/>
  <text x="276" y="130" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b56a3a">south street</text>
  <text x="170" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b56a3a">east street</text>
  <text x="260" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1c2430">S(i,j) = max( N + south,  W + east )</text>

</svg>
